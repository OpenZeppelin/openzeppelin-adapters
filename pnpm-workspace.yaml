packages:
  - 'packages/*'
  - '!**/node_modules/**'
overrides:
  # @metamask/eth-json-rpc-provider published no `license` field (and no LICENSE
  # file) for 1.0.0-2.1.0; 2.2.0 onwards are ISC and ship the licence text.
  # eth-block-tracker@7 declares ^1.0.0, but it imports only the
  # `SafeEventEmitterProvider` *type* -- there is no runtime reference in any of its
  # dist/*.js -- and 2.2.0 still exports that type, so crossing the major here is
  # type-only. Reached via @coinbase/wallet-sdk from @wagmi/connectors.
  '@metamask/eth-json-rpc-provider': ^2.2.0
  use-sync-external-store: ^1.2.0
  valtio: ^1.13.2
  '@paulmillr/qr': 'npm:qr@^0.5.0'
  '@types/react': ^19.1.8
  # Exact pin: dedupe / peer-align with linked @openzeppelin/ui-react (peer 7.80.0). Without it,
  # adapter packages (^7.62.0) resolve a different 7.x under local UI link and TS2322 Control-type
  # errors surface (adapter-stellar 7.71.2 vs ui-react 7.80.0). See chore commit a3ba40a.
  react-hook-form: 7.80.0
  # Dedupe / peer-align @openzeppelin/ui-types to ONE copy across the workspace. Every adapter now
  # declares ^3.5.2, but ui-components / ui-react / ui-utils on the v3 line each depend on it too,
  # so without the override pnpm can satisfy those independently and keep two copies. The
  # structurally identical EcosystemRuntime / CapabilityFactoryMap then become nominally distinct
  # — TS2322/TS2345 in profiles/shared-state.ts. Same class as the react-hook-form pin above.
  # Consumers are unaffected (ui-types is a peer, resolved once in the host app); this only
  # constrains workspace dev/CI resolution.
  '@openzeppelin/ui-types': ^3.5.2
  # Dedupe @types/node so vite@8 resolves once. Without this, 25.9.1 vs 26.1.1
  # yields two vite instances and adapters-vite typecheck fails (TS2345 on
  # MidnightAdapterPluginFactories). Same class as the ui-types pin above.
  '@types/node': 25.9.1
  '@wagmi/core': ^2.20.3
  glob: ^11.1.0
  zod: ^3.25.76
  viem: 2.44.4
  '@midnight-ntwrk/midnight-js-contracts': 2.0.2
  '@midnight-ntwrk/midnight-js-http-client-proof-provider': 2.0.2
  '@midnight-ntwrk/midnight-js-indexer-public-data-provider': 2.0.2
  '@midnight-ntwrk/midnight-js-network-id': 2.0.2
  '@midnight-ntwrk/midnight-js-types': 2.0.2
  '@midnight-ntwrk/midnight-js-utils': 2.0.2
  'protobufjs@<7.6.3': ^7.6.3
  '@protobufjs/utf8@<1.1.1': ^1.1.1
  'hono@<4.12.25': ^4.12.25
  'ws@>=8.0.0 <8.21.0': ^8.21.0
  'ws@>=7.0.0 <7.5.11': ^7.5.11
  'vite@>=7.0.0 <7.3.5': ^7.3.5
  'lodash@<4.18.0': ^4.18.0
  'tmp@<0.2.6': ^0.2.6
  'form-data@>=4.0.0 <4.0.6': ^4.0.6
  'ua-parser-js@>=2.0.1 <2.0.10': ^2.0.10
  'js-yaml@>=4.0.0 <4.2.0': ^4.2.0
  'uuid@<11.1.1': ^11.1.1
  '@babel/core@<7.29.6': ^7.29.6
  'ip-address@<=10.1.0': ^10.1.1
# pnpm 11+ — allow dependency install/build scripts (see ui-builder pnpm-workspace.yaml)
allowBuilds:
  '@openzeppelin/adapter-stellar': true
  bigint-buffer: true
  blake-hash: true
  bufferutil: true
  classic-level: true
  esbuild: true
  keccak: true
  protobufjs: true
  secp256k1: true
  tiny-secp256k1: true
  unrs-resolver: true
  usb: true
  utf-8-validate: true
